# Render Blueprint for the Go API (api.sala.site).
# In Render: New -> Blueprint -> pick this repo. Render builds Go natively (no Docker).
# Values marked sync: false are entered in the Render dashboard, never in git.
services:
  - type: web
    name: sala-ai-api
    runtime: go
    rootDir: backend
    plan: starter        # free plans sleep and could miss Tap webhooks
    region: frankfurt    # closest Render region to Kuwait
    buildCommand: go build -o app .
    startCommand: ./app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SITE_URL
        value: https://ai.sala.site
      - key: API_URL
        value: https://api.sala.site
      - key: ALLOWED_ORIGINS
        value: https://ai.sala.site,https://jamalxcode.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TAP_SECRET_KEY
        sync: false
