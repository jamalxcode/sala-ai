{{ define "main" }}
<section id="login" class="card narrow" hidden>
  <h1>{{ i18n "login_title" }}</h1>
  <p class="muted">{{ i18n "login_intro" }}</p>
  <form id="login-form">
    <label for="email">{{ i18n "email" }}</label>
    <input id="email" name="email" type="email" autocomplete="email" required dir="ltr">
    <button type="submit">{{ i18n "send_link" }}</button>
  </form>
</section>

<section id="account" hidden>
  <div class="card balance-card">
    <p class="muted">{{ i18n "balance" }}</p>
    <p class="balance"><span id="balance">–</span> <small>{{ i18n "credits" }}</small></p>
    <p class="fine">{{ i18n "cap_note" }}</p>
    <p class="fine"><span>{{ i18n "signed_in_as" }}</span> <b id="who" dir="ltr"></b> · <button id="sign-out" class="link" type="button">{{ i18n "sign_out" }}</button></p>
  </div>

  <h2>{{ i18n "history" }}</h2>
  <table class="ledger">
    <tbody id="ledger"></tbody>
  </table>
</section>

<p id="message" class="message" role="status" hidden></p>
{{ end }}
