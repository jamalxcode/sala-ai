<!doctype html>
<html lang="{{ .Site.Language.LanguageCode }}" dir="{{ .Site.Language.LanguageDirection | default "ltr" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ i18n "tagline" }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  {{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">
  {{ end }}
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="{{ "" | relLangURL }}">Sala</a>
      <nav>
        {{ range .Translations }}<a class="lang" href="{{ .RelPermalink }}" hreflang="{{ .Language.LanguageCode }}">{{ .Language.LanguageName }}</a>{{ end }}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="foot">
    <div class="wrap">
      <p class="links">
        <a href="{{ "terms/" | relLangURL }}">{{ i18n "footer_terms" }}</a>
        <a href="{{ "privacy/" | relLangURL }}">{{ i18n "footer_privacy" }}</a>
      </p>
      <p class="copy">© {{ now.Year }} Sala</p>
    </div>
  </footer>
</body>
</html>
