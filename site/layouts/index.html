{{ define "main" }}
<section class="hero">
  <h1>{{ i18n "packs_title" }}</h1>
  <p class="lead">{{ i18n "packs_intro" }}</p>
</section>

<section id="packs" class="packs" aria-live="polite">
  <p class="muted">{{ i18n "loading" }}</p>
</section>

<p id="message" class="message" role="status" hidden></p>
<p class="fine">{{ i18n "agree" }}</p>

<section class="models">
  <h2>{{ i18n "models_title" }}</h2>
  <p class="muted">{{ i18n "models_intro" }}</p>
  <div id="models"></div>
</section>

{{ .Content }}
{{ end }}
